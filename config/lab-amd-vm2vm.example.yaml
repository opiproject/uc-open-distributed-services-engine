# ODSE VM-to-VM single-DPU lab EXAMPLE — AMD Pensando.
# Copy to config/lab-amd-vm2vm.yaml (gitignored) and replace every
# placeholder from real discovery output. Do not treat any name, IP, or
# PCI address below as real hardware.
#
# IPs use documentation ranges: TEST-NET-1 (192.0.2.0/24) for
# management/DPU addresses, TEST-NET-2 (198.51.100.0/24) for guest VM
# addresses. Hostnames use .example.invalid.
#
# AMD Pensando is explicitly discovery-first in this project
# (docs/vendor-readiness/amd-pensando.md): switchdev, representors, OVS
# offload, and vDPA are NOT assumed. preferred_datapath is 'discovery'.
# configure_forwarding() may return discovery-required or
# error=REPRESENTOR_OR_CONTROL_PATH_REQUIRED until representors or a
# control path are actually discovered on real hardware.

schema: odse-lab-vm2vm/v1alpha1

host:
  name: <HOST_NAME>
  management_interface: <MGMT_IFACE>
  ssh_user: <HOST_SSH_USER>
  preserve_interfaces: []
  os_family: RedHat

vendor:
  type: amd-pensando
  backend_module: null
  profile: amd-pensando-discovery-first

amd_pensando:
  mode: discovery-first
  require_ionic: true
  require_sriov: false
  require_representors: false
  require_switchdev: false
  require_ovs: false
  require_rdma: false
  allow_assumed_forwarding: false

dpu:
  pf_name: <IONIC_PF_NETDEV>
  pf_pci: <IONIC_PCI_ADDRESS>
  uplink_name: null
  uplink_pci: null
  management_ip: 192.0.2.40
  num_vfs: 2
  enable_switchdev: false
  enable_ovs_hw_offload: false
  preferred_datapath: discovery

ovs:
  bridge: br-int
  datapath_type: null
  fail_mode: null
  ports: []

vms:
  - name: odse-vm2vm-vm1
    image: <VM_IMAGE>
    memory_mb: 2048
    vcpus: 2
    vf_index: 0
    vf_pci: null
    mac: null
    ip_cidr: 198.51.100.41/24
    gateway: null
    ssh_user: <VM_SSH_USER>
    management_ip: null   # optional; if null, labctl falls back to `virsh domifaddr odse-vm2vm-vm1`
    ssh_key_path: null    # optional; set if ssh's default identity isn't the key authorized into this guest
  - name: odse-vm2vm-vm2
    image: <VM_IMAGE>
    memory_mb: 2048
    vcpus: 2
    vf_index: 1
    vf_pci: null
    mac: null
    ip_cidr: 198.51.100.42/24
    gateway: null
    ssh_user: <VM_SSH_USER>
    management_ip: null   # optional; if null, labctl falls back to `virsh domifaddr odse-vm2vm-vm2`
    ssh_key_path: null    # optional; set if ssh's default identity isn't the key authorized into this guest

traffic:
  type: "ping and iperf3"
  duration_seconds: 30
  iperf_parallel_streams: 4
  packet_size: null

validation:
  collect_ovs_flows: false
  collect_tc_filters: false
  collect_ethtool_stats: true
  collect_cpu_stats: true
  collect_vendor_telemetry: true

safety:
  dry_run_default: true
  require_apply: true
  forbid_management_interface_changes: true
  cleanup_on_failure: false

# forwarding: may return discovery-required depending on backend
# capability. Do not assume switchdev, OVS offload, vDPA, or vendor flow
# APIs exist. If representors are discovered, the AMD backend falls back
# to the common OVS bridge path; otherwise it returns
# error=REPRESENTOR_OR_CONTROL_PATH_REQUIRED with discovered capabilities
# and gaps recorded in the result.
forwarding:
  name: odse-vm2vm-amd
  type: l2-vm-to-vm
  mode: bridge
  endpoints:
    - name: vm1-endpoint
      vm: odse-vm2vm-vm1
      vf_index: 0
      vf_pci: null
      representor: null
      mac: null
      ip_cidr: 198.51.100.41/24
    - name: vm2-endpoint
      vm: odse-vm2vm-vm2
      vf_index: 1
      vf_pci: null
      representor: null
      mac: null
      ip_cidr: 198.51.100.42/24
  policy:
    action: allow
    bidirectional: true
  offload:
    requested: false
    fallback_to_software: true
    require_confirmed_offload: false
  explicit_flows:
    enabled: false
