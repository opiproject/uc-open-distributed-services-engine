---
galaxy_info:
  role_name: ovs_setup
  namespace: odse
  author: Open Distributed Services Engine contributors
  description: >-
    Configures Open vSwitch for offload experiments: service lifecycle,
    other_config:hw-offload, bridges, ports/representors, and
    datapath_type, in a vendor-neutral way.
  license: Apache-2.0
  min_ansible_version: "2.14"

  platforms:
    - name: EL
      versions:
        - "8"
        - "9"
    - name: Fedora
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: Debian
      versions:
        - all
    - name: openSUSE
      versions:
        - all

  galaxy_tags:
    - networking
    - openvswitch
    - ovs
    - offload
    - dpu
    - switchdev

dependencies: []
