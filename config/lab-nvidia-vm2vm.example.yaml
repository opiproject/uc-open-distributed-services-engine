# ODSE VM-to-VM single-DPU lab EXAMPLE — NVIDIA BlueField.
# Copy to config/lab-nvidia-vm2vm.yaml (gitignored) and replace every
# placeholder from real discovery output (tools/inventory/dpu_inventory.py,
# tools/topology-discovery/vf_to_representor_map.py). Do not treat any
# name, IP, or PCI address below as real hardware.
#
# IPs use documentation ranges: TEST-NET-1 (192.0.2.0/24) for
# management/DPU addresses, TEST-NET-2 (198.51.100.0/24) for guest VM
# addresses. Hostnames use .example.invalid.
#
# safety.dry_run_default: true means labctl will not honor --apply until
# you copy this file and set it to false. CLI --dry-run always wins over
# --apply regardless of this file (see config/README-lab-vm2vm.md).

schema: odse-lab-vm2vm/v1alpha1

vendor:
  type: nvidia-bluefield
  backend_module: null
  profile: nvidia-bluefield-dpu-mode

# Default NVIDIA path: OVS/OVS-DOCA and representors live on the DPU.
# Host only runs KVM/QEMU/libvirt and VF passthrough. Do not enable host OVS
# forwarding in this profile (see config/profiles/nvidia-connectx-host-switchdev.yaml).
nvidia:
  mode: dpu
  ovs_location: dpu
  representor_location: dpu
  datapath: ovs-doca
  allow_host_ovs_for_forwarding: false

host:
  name: <HOST_NAME>
  management_interface: <MGMT_IFACE>
  ssh_user: <HOST_SSH_USER>
  preserve_interfaces: []
  os_family: RedHat
  role:
    - kvm
    - qemu
    - libvirt
    - vf-passthrough

host_forwarding_control:
  enabled: false

dpu:
  pf_name: <PF_NAME>
  pf_pci: <PF_PCI>
  uplink_name: null
  uplink_pci: null
  management_ip: 192.0.2.10
  ssh_user: <DPU_SSH_USER>
  ssh_port: 22
  # Per-SSH-command timeout for remote_execution calls to the DPU.
  # discover-representors makes 3 sequential real SSH round trips when
  # representor_mapping.location=dpu and remote_execution.dry_run_default
  # is false; raise this (e.g. 60) if that times out on a slower/higher-
  # latency management link even though `ssh <dpu>` works fine by hand --
  # see docs/operations/dpu-remote-execution.md.
  command_timeout_seconds: 30
  num_vfs: 2
  enable_switchdev: false
  enable_ovs_hw_offload: true
  preferred_datapath: doca
  role:
    - representor-owner
    - ovs-owner
    - forwarding-owner

dpu_forwarding_control:
  enabled: true

remote_execution:
  enabled: true
  target: dpu
  dry_run_default: true

# VF representors live on the DPU. Host sysfs mapping is not used in this profile.
representor_mapping:
  location: dpu
  strategy: nvidia-portname
  require_high_confidence: true

ovs:
  bridge: br-int
  datapath_type: doca
  fail_mode: secure
  ports: []

vms:
  - name: odse-vm2vm-vm1
    image: <VM_IMAGE>
    memory_mb: 2048
    vcpus: 2
    vf_index: 0
    vf_pci: null
    mac: null
    ip_cidr: 198.51.100.11/24
    gateway: null
    # ssh_user/management_ip/ssh_key_path are also used by the verify-vms
    # stage's SSH reachability probe, not just configure-vm-ips/run-traffic.
    ssh_user: <VM_SSH_USER>
    # If null, labctl falls back to `virsh domifaddr odse-vm2vm-vm1`
    management_ip: null
    # If null, ssh uses its own default identity (ssh-agent / ~/.ssh/config
    # / ~/.ssh/id_*). Set explicitly if that default isn't the key you
    # authorized into this guest image -- otherwise verify-vms/
    # configure-vm-ips/run-traffic all fail with "Permission denied
    # (publickey)" even though `ssh -i <path> user@host` works by hand.
    ssh_key_path: null
  - name: odse-vm2vm-vm2
    image: <VM_IMAGE>
    memory_mb: 2048
    vcpus: 2
    vf_index: 1
    vf_pci: null
    mac: null
    ip_cidr: 198.51.100.12/24
    gateway: null
    ssh_user: <VM_SSH_USER>
    # If null, labctl falls back to `virsh domifaddr odse-vm2vm-vm2`
    management_ip: null
    ssh_key_path: null

traffic:
  type: "ping and iperf3"
  duration_seconds: 30
  iperf_parallel_streams: 4
  packet_size: null

validation:
  collect_ovs_flows: true
  collect_tc_filters: true
  collect_ethtool_stats: true
  collect_cpu_stats: true
  collect_vendor_telemetry: true

safety:
  dry_run_default: true
  require_apply: true
  forbid_management_interface_changes: true
  cleanup_on_failure: false

# forwarding: — see docs/architecture/forwarding-intent-model.md. NVIDIA's
# backend has the most complete configure_forwarding() implementation
# (dry-run OVS bridge/representor planning); this is the reference
# example for l2-vm-to-vm forwarding with two endpoints.
forwarding:
  name: odse-vm2vm-nvidia
  type: l2-vm-to-vm
  mode: bridge
  endpoints:
    - name: vm1-endpoint
      vm: odse-vm2vm-vm1
      vf_index: 0
      vf_pci: null
      representor: null
      mac: null
      ip_cidr: 198.51.100.11/24
    - name: vm2-endpoint
      vm: odse-vm2vm-vm2
      vf_index: 1
      vf_pci: null
      representor: null
      mac: null
      ip_cidr: 198.51.100.12/24
  policy:
    action: allow
    bidirectional: true
  offload:
    requested: true
    fallback_to_software: true
    require_confirmed_offload: false
  explicit_flows:
    enabled: false
