# ODSE VM-to-VM single-DPU lab EXAMPLE — Marvell OCTEON.
# Copy to config/lab-marvell-vm2vm.yaml (gitignored) and replace every
# placeholder from real discovery output. Do not treat any name, IP, or
# PCI address below as real hardware.
#
# IPs use documentation ranges: TEST-NET-1 (192.0.2.0/24) for
# management/DPU addresses, TEST-NET-2 (198.51.100.0/24) for guest VM
# addresses. Hostnames use .example.invalid.
#
# Marvell's DAO OVS-offload / DPDK representor path is documented as
# "likely", not "supported" (docs/vendor-readiness/marvell-octeon.md);
# preferred_datapath is set to 'dao' to reflect the intended path, but
# configure_forwarding() may still return discovery-required until DAO
# availability is confirmed on real hardware (see
# plugins/marvell_octeon/backend.py).

schema: odse-lab-vm2vm/v1alpha1

host:
  name: <HOST_NAME>
  management_interface: <MGMT_IFACE>
  ssh_user: <HOST_SSH_USER>
  preserve_interfaces: []
  os_family: RedHat

vendor:
  type: marvell-octeon
  backend_module: null
  profile: marvell-octeon-dao-ovs-offload

marvell:
  mode: dao-ovs-offload
  ovs_location: dpu
  representor_model: dpdk
  datapath: dao
  require_dao: true
  require_dpdk: true
  allow_host_ovs_for_forwarding: false

dpdk:
  hugepages_required: true
  required_driver: vfio-pci
  devbind_required: true

dao:
  ovs_offload_binary: null
  config_file: null
  service_name: null
  require_running: false

representor_mapping:
  location: dpu
  model: dpdk
  strategy: marvell-dpdk-representor
  require_high_confidence: true

dpu:
  pf_name: <OCTEON_PF_NETDEV>
  pf_pci: <OCTEON_PCI_ADDRESS>
  uplink_name: null
  uplink_pci: null
  management_ip: 192.0.2.30
  num_vfs: 2
  enable_switchdev: false
  enable_ovs_hw_offload: true
  preferred_datapath: dao

ovs:
  bridge: br-int
  datapath_type: netdev
  fail_mode: secure
  ports: []

vms:
  - name: odse-vm2vm-vm1
    image: <VM_IMAGE>
    memory_mb: 2048
    vcpus: 2
    vf_index: 0
    vf_pci: null
    mac: null
    ip_cidr: 198.51.100.21/24
    gateway: null
    ssh_user: <VM_SSH_USER>
    management_ip: null   # optional; if null, labctl falls back to `virsh domifaddr odse-vm2vm-vm1`
    ssh_key_path: null    # optional; set if ssh's default identity isn't the key authorized into this guest
  - name: odse-vm2vm-vm2
    image: <VM_IMAGE>
    memory_mb: 2048
    vcpus: 2
    vf_index: 1
    vf_pci: null
    mac: null
    ip_cidr: 198.51.100.22/24
    gateway: null
    ssh_user: <VM_SSH_USER>
    management_ip: null   # optional; if null, labctl falls back to `virsh domifaddr odse-vm2vm-vm2`
    ssh_key_path: null    # optional; set if ssh's default identity isn't the key authorized into this guest

traffic:
  type: "ping and iperf3"
  duration_seconds: 30
  iperf_parallel_streams: 4
  packet_size: null

validation:
  collect_ovs_flows: true
  collect_tc_filters: true
  collect_ethtool_stats: true
  collect_cpu_stats: true
  collect_vendor_telemetry: true

safety:
  dry_run_default: true
  require_apply: true
  forbid_management_interface_changes: true
  cleanup_on_failure: false

# forwarding: — see docs/architecture/forwarding-intent-model.md. Marvell
# uses l2-vm-to-vm like NVIDIA, but the backend's configure_forwarding()
# is a staged skeleton: it validates DPDK representor mapping and DAO
# availability, and returns success=false with a specific error
# (DAO_NOT_AVAILABLE / REPRESENTOR_MAPPING_REQUIRED) rather than a fake
# success when those are not discovered.
forwarding:
  name: odse-vm2vm-marvell
  type: l2-vm-to-vm
  mode: bridge
  endpoints:
    - name: vm1-endpoint
      vm: odse-vm2vm-vm1
      vf_index: 0
      vf_pci: null
      representor: null
      mac: null
      ip_cidr: 198.51.100.21/24
    - name: vm2-endpoint
      vm: odse-vm2vm-vm2
      vf_index: 1
      vf_pci: null
      representor: null
      mac: null
      ip_cidr: 198.51.100.22/24
  policy:
    action: allow
    bidirectional: true
  offload:
    requested: true
    fallback_to_software: true
    require_confirmed_offload: false
  explicit_flows:
    enabled: false
